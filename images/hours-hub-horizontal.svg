<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#004E89;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1A659E;stop-opacity:1" />
        </linearGradient>

        <filter id="sh" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Icon -->
    <g transform="translate(30, 30)">
        <circle cx="70" cy="70" r="65" fill="none" stroke="#F0F0F0" stroke-width="1" opacity="0.2"/>
        
        <path d="M 70 30 L 110 50 L 110 110 L 70 130 L 30 110 L 30 50 Z" 
              fill="url(#secGrad)" opacity="0.9" filter="url(#sh)"/>
        
        <rect x="60" y="55" width="6" height="30" fill="url(#mainGrad)" rx="3"/>
        <rect x="80" y="55" width="6" height="30" fill="url(#mainGrad)" rx="3"/>
        <rect x="60" y="67" width="26" height="6" fill="url(#mainGrad)" rx="3"/>
        
        <circle cx="70" cy="70" r="15" fill="url(#mainGrad)" filter="url(#sh)"/>
        <circle cx="70" cy="70" r="10" fill="white" opacity="0.3"/>
        <circle cx="70" cy="70" r="5" fill="url(#mainGrad)"/>
        
        <circle cx="70" cy="40" r="6" fill="url(#mainGrad)" opacity="0.8"/>
        <circle cx="95" cy="55" r="5" fill="url(#mainGrad)" opacity="0.6"/>
        <circle cx="95" cy="85" r="5" fill="url(#mainGrad)" opacity="0.6"/>
        <circle cx="70" cy="100" r="6" fill="url(#mainGrad)" opacity="0.8"/>
        <circle cx="45" cy="85" r="5" fill="url(#mainGrad)" opacity="0.6"/>
        <circle cx="45" cy="55" r="5" fill="url(#mainGrad)" opacity="0.6"/>
        
        <line x1="70" y1="40" x2="70" y2="55" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
        <line x1="95" y1="55" x2="85" y2="63" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
        <line x1="95" y1="85" x2="85" y2="77" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
        <line x1="70" y1="100" x2="70" y2="85" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
        <line x1="45" y1="85" x2="55" y2="77" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
        <line x1="45" y1="55" x2="55" y2="63" stroke="url(#mainGrad)" stroke-width="2" opacity="0.5"/>
    </g>
    
    <!-- Text -->
    <text x="200" y="105" font-family="Syne, sans-serif" font-size="64" font-weight="800" fill="#1A1A1A" letter-spacing="-2">HOURS</text>
    <text x="200" y="155" font-family="Syne, sans-serif" font-size="48" font-weight="700" fill="url(#mainGrad)" letter-spacing="-1">HUB</text>
</svg>
