<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#004E89;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1A659E;stop-opacity:1" />
        </linearGradient>

        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Outer ring with segments -->
    <circle cx="200" cy="200" r="160" fill="none" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
    
    <!-- 12 segments around the clock -->
    <circle cx="200" cy="40" r="8" fill="url(#mainGradient)" opacity="0.4"/>
    <circle cx="290.88" cy="63.4" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="336.6" cy="109.12" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="360" cy="200" r="8" fill="url(#mainGradient)" opacity="0.4"/>
    <circle cx="336.6" cy="290.88" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="290.88" cy="336.6" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="200" cy="360" r="8" fill="url(#mainGradient)" opacity="0.4"/>
    <circle cx="109.12" cy="336.6" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="63.4" cy="290.88" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="40" cy="200" r="8" fill="url(#mainGradient)" opacity="0.4"/>
    <circle cx="63.4" cy="109.12" r="6" fill="url(#mainGradient)" opacity="0.3"/>
    <circle cx="109.12" cy="63.4" r="6" fill="url(#mainGradient)" opacity="0.3"/>

    <!-- Hub hexagon structure -->
    <g filter="url(#shadow)">
        <path d="M 200 100 L 286.6 150 L 286.6 250 L 200 300 L 113.4 250 L 113.4 150 Z" 
              fill="url(#secondaryGradient)" opacity="0.9"/>
        
        <path d="M 200 130 L 260 165 L 260 235 L 200 270 L 140 235 L 140 165 Z" 
              fill="white" opacity="0.1"/>
    </g>

    <!-- Clock hands forming 'H' shape -->
    <rect x="190" y="150" width="8" height="80" fill="url(#mainGradient)" rx="4"/>
    <rect x="232" y="150" width="8" height="80" fill="url(#mainGradient)" rx="4"/>
    <rect x="190" y="186" width="50" height="8" fill="url(#mainGradient)" rx="4"/>

    <!-- Central hub circle -->
    <circle cx="200" cy="200" r="30" fill="url(#mainGradient)" filter="url(#shadow)"/>
    <circle cx="200" cy="200" r="20" fill="white" opacity="0.3"/>
    <circle cx="200" cy="200" r="10" fill="url(#mainGradient)"/>

    <!-- Connection nodes -->
    <circle cx="200" cy="130" r="12" fill="url(#mainGradient)" opacity="0.8"/>
    <circle cx="250" cy="165" r="10" fill="url(#mainGradient)" opacity="0.6"/>
    <circle cx="250" cy="235" r="10" fill="url(#mainGradient)" opacity="0.6"/>
    <circle cx="200" cy="270" r="12" fill="url(#mainGradient)" opacity="0.8"/>
    <circle cx="150" cy="235" r="10" fill="url(#mainGradient)" opacity="0.6"/>
    <circle cx="150" cy="165" r="10" fill="url(#mainGradient)" opacity="0.6"/>

    <!-- Connection lines -->
    <line x1="200" y1="130" x2="200" y2="170" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
    <line x1="250" y1="165" x2="230" y2="180" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
    <line x1="250" y1="235" x2="230" y2="220" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
    <line x1="200" y1="270" x2="200" y2="230" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
    <line x1="150" y1="235" x2="170" y2="220" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
    <line x1="150" y1="165" x2="170" y2="180" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
</svg>
